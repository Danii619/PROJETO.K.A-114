<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PROJECT114 — Central de Arquivos</title>
    <meta name="theme-color" content="#111318">
    <meta name="description" content="Central de registros e arquivos do Protocolo K.A-114.">

    <!-- COMPARTILHAMENTO -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="PROJECT114 — Central de Arquivos">
    <meta property="og:description" content="Central de registros e arquivos do Protocolo K.A-114. Acesso restrito.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="PROJECT114 — Central de Arquivos">
    <meta name="twitter:description" content="Central de registros e arquivos do Protocolo K.A-114. Acesso restrito.">

    <!-- FAVICON -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23111318'/%3E%3Crect x='3' y='3' width='58' height='58' fill='none' stroke='%23a52a32' stroke-width='3'/%3E%3Ctext x='32' y='41' font-family='Courier New,monospace' font-size='24' font-weight='bold' text-anchor='middle' fill='%23e2a2a6'%3E114%3C/text%3E%3C/svg%3E">

    <style>
        :root {
            --bg: #111318;
            --sidebar: #15171d;
            --panel: #191c23;
            --panel-hover: #20242d;
            --border: #30343e;
            --text: #e5e7eb;
            --muted: #9298a5;
            --subtle: #626977;
            --red: #a52a32;
            --red-light: #d75a63;
            --red-bg: rgba(165, 42, 50, 0.12);
            --green: #8eaa96;
            --mono: "Courier New", monospace;
            --sans: Arial, Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 14px;
            line-height: 1.6;
        }

        /* SCANLINES */

        body::before {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.022) 0,
                rgba(255, 255, 255, 0.022) 1px,
                transparent 1px,
                transparent 3px
            );
            content: "";
            pointer-events: none;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        button, a {
            -webkit-tap-highlight-color: transparent;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--red-light);
            outline-offset: 4px;
        }

        .mono {
            font-family: var(--mono);
        }

        .muted {
            color: var(--muted);
        }

        .eyebrow {
            color: var(--muted);
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* SKIP LINK */

        .skip-link {
            position: fixed;
            top: -60px;
            left: 12px;
            z-index: 200;
            padding: 9px 13px;
            border: 1px solid #75404a;
            background: #59262e;
            color: #fff;
            font-family: var(--mono);
            font-size: 11px;
            transition: top .2s ease;
        }

        .skip-link:focus {
            top: 12px;
        }

        /* ESTRUTURA PRINCIPAL */

        .app {
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            inset: 0 auto 0 0;
            z-index: 10;
            display: flex;
            width: 246px;
            flex-direction: column;
            padding: 25px 17px 18px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 8px 26px;
            border-bottom: 1px solid var(--border);
        }

        .brand-symbol {
            display: grid;
            width: 39px;
            height: 39px;
            flex-shrink: 0;
            place-items: center;
            background: var(--red-bg);
            border: 1px solid #633039;
            color: #e2a2a6;
            font-size: 18px;
            font-weight: bold;
        }

        .brand-name {
            margin: 0;
            font-size: 15px;
            letter-spacing: 1.5px;
        }

        .brand-subtitle {
            margin-top: 2px;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: .7px;
        }

        .nav-heading {
            margin: 27px 8px 10px;
            color: var(--subtle);
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .nav-list {
            display: grid;
            gap: 4px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 42px;
            padding: 10px 12px;
            border: 1px solid transparent;
            border-radius: 4px;
            color: #b3b8c3;
            font-size: 12px;
            transition: .2s ease;
        }

        .nav-icon {
            width: 19px;
            color: #9298a5;
            font-family: var(--mono);
            font-size: 15px;
            text-align: center;
        }

        .nav-link:hover {
            background: var(--panel-hover);
            color: #fff;
        }

        .nav-link.active {
            background: var(--red-bg);
            border-color: #493036;
            color: #fff;
        }

        .nav-link.active .nav-icon {
            color: var(--red-light);
        }

        .sidebar-bottom {
            margin-top: auto;
            padding: 15px 8px 0;
            border-top: 1px solid var(--border);
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--muted);
            font-size: 11px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            flex-shrink: 0;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px #8eaa9640;
            animation: pulse 2.4s ease-in-out infinite;
        }

        .sidebar-version {
            margin-top: 9px;
            color: var(--subtle);
            font-family: var(--mono);
            font-size: 9px;
        }

        /* ÁREA DE CONTEÚDO */

        .main {
            min-width: 0;
            margin-left: 246px;
        }

        .topbar {
            display: flex;
            min-height: 60px;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 0 36px;
            border-bottom: 1px solid var(--border);
            background: #14161c;
        }

        .breadcrumb {
            color: var(--muted);
            font-family: var(--mono);
            font-size: 10px;
        }

        .breadcrumb span {
            color: var(--text);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .session-clock {
            color: var(--subtle);
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .6px;
            white-space: nowrap;
        }

        .session-clock b {
            color: var(--muted);
            font-weight: normal;
        }

        .restricted {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 9px;
            border: 1px solid #593238;
            background: var(--red-bg);
            color: #dca1a5;
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: .6px;
        }

        .restricted-dot {
            width: 6px;
            height: 6px;
            background: var(--red-light);
            animation: blink 1.8s steps(2, start) infinite;
        }

        .content {
            width: 100%;
            max-width: 1360px;
            margin: 0 auto;
            padding: 35px 36px 24px;
        }

        /* CABEÇALHO DO PROTOCOLO */

        .hero {
            position: relative;
            overflow: hidden;
            padding: 30px;
            border: 1px solid var(--border);
            background:
                linear-gradient(110deg, #1a1c23 0%, #171920 65%, #21181c 100%);
        }

        .hero::after {
            position: absolute;
            top: -70px;
            right: -40px;
            width: 290px;
            height: 290px;
            border: 1px solid #ffffff08;
            border-radius: 50%;
            box-shadow:
                0 0 0 35px #ffffff03,
                0 0 0 70px #ffffff02;
            content: "";
            pointer-events: none;
        }

        .stamp {
            position: absolute;
            top: 26px;
            right: 30px;
            z-index: 1;
            padding: 6px 13px;
            border: 2px solid rgba(215, 90, 99, 0.5);
            color: rgba(215, 90, 99, 0.55);
            font-family: var(--mono);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 3px;
            transform: rotate(7deg);
            pointer-events: none;
            user-select: none;
        }

        .hero-topline {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 18px;
            color: #c17a80;
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 1.4px;
        }

        .hero h1 {
            position: relative;
            z-index: 1;
            margin: 0;
            font-size: clamp(26px, 3.4vw, 40px);
            font-weight: 600;
            letter-spacing: -.8px;
            line-height: 1.2;
        }

        .caret {
            display: inline-block;
            width: 3px;
            height: .85em;
            margin-left: 4px;
            vertical-align: -0.05em;
            background: var(--red-light);
            animation: blink 1s steps(2, start) infinite;
        }

        .hero-description {
            max-width: 590px;
            margin: 14px 0 25px;
            color: #a8adb8;
            font-size: 13px;
            line-height: 1.9;
        }

        .hero-meta {
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 10px 28px;
            padding-top: 17px;
            border-top: 1px solid var(--border);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-label {
            color: var(--subtle);
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 1px;
        }

        .meta-value {
            color: #d7d9df;
            font-family: var(--mono);
            font-size: 11px;
        }

        /* TEXTO CENSURADO */

        .redacted {
            padding: 0 3px;
            background: #07080b;
            color: transparent;
            cursor: help;
            transition: color .25s ease, background .25s ease;
            user-select: none;
        }

        .redacted:hover,
        .redacted:focus-visible {
            background: #1c1f27;
            color: #e1b2b5;
            user-select: text;
        }

        /* SEÇÕES */

        .section {
            margin-top: 34px;
        }

        .section-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 15px;
        }

        .section-heading h2 {
            margin: 3px 0 0;
            font-size: 17px;
            font-weight: 500;
            letter-spacing: -.2px;
        }

        .section-count {
            color: var(--subtle);
            font-family: var(--mono);
            font-size: 10px;
        }

        /* ALERTA */

        .alert {
            display: flex;
            align-items: flex-start;
            gap: 13px;
            padding: 15px 17px;
            border: 1px solid #513039;
            background: #20171b;
        }

        .alert-symbol {
            display: grid;
            width: 29px;
            height: 29px;
            flex-shrink: 0;
            place-items: center;
            border: 1px solid #704047;
            color: #df858c;
            font-weight: bold;
        }

        .alert-title {
            margin: 0 0 3px;
            color: #e1b2b5;
            font-size: 12px;
            font-weight: 600;
        }

        .alert p {
            margin: 0;
            color: #b3a4a8;
            font-size: 12px;
            line-height: 1.8;
        }

        /* INDIVÍDUOS */

        .people-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .person-card {
            display: block;
            min-width: 0;
            padding: 19px;
            border: 1px solid var(--border);
            background: var(--panel);
            transition:
                border-color .2s ease,
                background .2s ease,
                transform .2s ease;
        }

        .person-card:hover {
            transform: translateY(-2px);
            border-color: #634047;
            background: var(--panel-hover);
        }

        .person-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .person-code {
            color: var(--subtle);
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: .8px;
        }

        .person-status {
            padding: 3px 7px;
            border: 1px solid var(--border);
            color: #aeb4c0;
            font-family: var(--mono);
            font-size: 9px;
            white-space: nowrap;
        }

        .person-status.warn {
            border-color: #7a3a42;
            background: var(--red-bg);
            color: var(--red-light);
            animation: pulse 2s ease-in-out infinite;
        }

        .person-card h3 {
            margin: 13px 0 0;
            font-size: 15px;
            font-weight: 600;
        }

        .person-card:hover h3 {
            animation: glitch .35s steps(2, end) 1;
        }

        .person-divider {
            margin: 15px 0;
            border-top: 1px solid var(--border);
        }

        .person-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .info-label {
            display: block;
            margin-bottom: 4px;
            color: var(--subtle);
            font-size: 10px;
        }

        .info-value {
            display: block;
            color: #d0d3da;
            font-size: 12px;
        }

        .person-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 17px;
            color: var(--muted);
            font-size: 11px;
        }

        .open-arrow {
            color: var(--red-light);
            font-size: 16px;
        }

        /* ÍNDICE DE ARQUIVOS */

        .archive-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .archive-card {
            display: flex;
            min-width: 0;
            flex-direction: column;
            align-items: flex-start;
            padding: 19px;
            border: 1px solid var(--border);
            background: var(--panel);
            transition: .2s ease;
        }

        .archive-card:hover {
            border-color: #634047;
            background: var(--panel-hover);
        }

        .archive-icon {
            display: grid;
            width: 35px;
            height: 35px;
            margin-bottom: 16px;
            place-items: center;
            border: 1px solid #383c47;
            background: #20232b;
            color: #c4c8d1;
            font-family: var(--mono);
            font-size: 15px;
        }

        .archive-card h3 {
            margin: 0;
            font-size: 12px;
            font-weight: 600;
        }

        .archive-card p {
            flex: 1;
            margin: 7px 0 17px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.7;
        }

        .archive-action {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            color: #c4c8d1;
            font-size: 10px;
        }

        .archive-action span:last-child {
            color: var(--red-light);
        }

        /* DOCUMENTOS RECUPERADOS */

        .recovered {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 22px;
            border: 1px solid #49333a;
            background: linear-gradient(100deg, #1e191e, #191a21);
        }

        .recovered-main {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .recovered-icon {
            display: grid;
            width: 43px;
            height: 43px;
            flex-shrink: 0;
            place-items: center;
            border: 1px solid #633a43;
            color: #d58b91;
            font-family: var(--mono);
            font-size: 19px;
        }

        .recovered h3 {
            margin: 0 0 5px;
            font-size: 14px;
        }

        .recovered p {
            max-width: 470px;
            margin: 0;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.8;
        }

        .download-btn {
            display: inline-flex;
            min-height: 39px;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 15px;
            border: 1px solid #75404a;
            background: #59262e;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: .2s ease;
        }

        .download-btn:hover {
            background: #71313a;
        }

        .download-btn:disabled {
            cursor: wait;
            opacity: .65;
        }

        /* RODAPÉ */

        .footer {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-top: 36px;
            padding: 20px 0 5px;
            border-top: 1px solid var(--border);
            color: var(--subtle);
            font-family: var(--mono);
            font-size: 9px;
            line-height: 1.9;
        }

        .footer p {
            margin: 0;
        }

        .footer a {
            color: #b1a0a4;
        }

        .footer a:hover {
            color: #fff;
        }

        .footer-right {
            text-align: right;
        }

        /* ANIMAÇÕES */

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .45; }
        }

        @keyframes glitch {
            0% {
                text-shadow: 2px 0 var(--red-light), -2px 0 #5aa0d7;
                transform: translateX(1px);
            }
            50% {
                text-shadow: -2px 0 var(--red-light), 2px 0 #5aa0d7;
                transform: translateX(-1px);
            }
            100% {
                text-shadow: none;
                transform: none;
            }
        }

        .hero,
        .alert,
        .person-card,
        .archive-card,
        .recovered {
            animation: fadeUp .55s ease backwards;
        }

        .alert { animation-delay: .1s; }

        .person-card:nth-child(1) { animation-delay: .15s; }
        .person-card:nth-child(2) { animation-delay: .23s; }
        .person-card:nth-child(3) { animation-delay: .31s; }
        .person-card:nth-child(4) { animation-delay: .39s; }

        .archive-card:nth-child(1) { animation-delay: .1s; }
        .archive-card:nth-child(2) { animation-delay: .16s; }
        .archive-card:nth-child(3) { animation-delay: .22s; }
        .archive-card:nth-child(4) { animation-delay: .28s; }
        .archive-card:nth-child(5) { animation-delay: .34s; }
        .archive-card:nth-child(6) { animation-delay: .4s; }
        .archive-card:nth-child(7) { animation-delay: .46s; }

        .recovered { animation-delay: .2s; }

        /* RESPONSIVIDADE */

        .mobile-brand {
            display: none;
        }

        @media (min-width: 1500px) {
            .content {
                padding-top: 45px;
            }
        }

        @media (max-width: 1100px) {
            .sidebar {
                width: 215px;
            }

            .main {
                margin-left: 215px;
            }

            .topbar {
                padding: 0 24px;
            }

            .content {
                padding: 27px 24px 22px;
            }

            .archive-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 760px) {
            .sidebar {
                position: static;
                width: 100%;
                padding: 14px 16px;
                border-right: 0;
                border-bottom: 1px solid var(--border);
            }

            .brand {
                padding: 0 0 13px;
                border-bottom: 0;
            }

            .brand-symbol {
                width: 34px;
                height: 34px;
            }

            .nav-heading,
            .sidebar-bottom {
                display: none;
            }

            .nav-list {
                display: flex;
                gap: 7px;
                overflow-x: auto;
                padding: 9px 0 2px;
                scrollbar-width: thin;
            }

            .nav-link {
                min-height: 35px;
                flex-shrink: 0;
                gap: 7px;
                padding: 7px 10px;
                border-color: var(--border);
                font-size: 11px;
            }

            .nav-icon {
                width: auto;
                font-size: 12px;
            }

            .main {
                margin-left: 0;
            }

            .topbar {
                min-height: 47px;
                padding: 0 17px;
            }

            .breadcrumb {
                font-size: 9px;
            }

            .restricted {
                font-size: 8px;
            }

            .session-clock {
                display: none;
            }

            .topbar-right {
                gap: 0;
            }

            .content {
                padding: 20px 16px;
            }

            .hero {
                padding: 23px 19px;
            }

            .hero h1 {
                font-size: 28px;
            }

            .hero-description {
                font-size: 12px;
            }

            .hero-meta {
                gap: 15px 23px;
            }

            .stamp {
                top: 14px;
                right: 14px;
                padding: 4px 9px;
                font-size: 10px;
                letter-spacing: 2px;
            }

            .people-grid {
                grid-template-columns: 1fr;
            }

            .archive-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .archive-card {
                padding: 15px;
            }

            .recovered {
                align-items: flex-start;
                flex-direction: column;
                padding: 18px;
            }

            .download-btn {
                width: 100%;
            }

            .footer {
                flex-direction: column;
                gap: 10px;
            }

            .footer-right {
                text-align: left;
            }
