<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0e">
  <title>Terminal SAC 51</title>
  <style>
    :root {
      --bg: #0a0b0e;
      --panel: #12141a;
      --key: #1b1e26;
      --key-hover: #262a35;
      --border: #30343e;
      --text: #e5e7eb;
      --muted: #9298a5;
      --subtle: #626977;
      --red: #a52a32;
      --red-light: #d75a63;
      --green: #4cff7a;
      --mono: "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--bg);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding:
        max(20px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 50% 0%, #1a1217 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: var(--mono);
    }

    /* Scanlines */
    body::before {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.02) 0,
        rgba(255, 255, 255, 0.02) 1px,
        transparent 1px,
        transparent 3px
      );
      content: "";
      pointer-events: none;
    }

    .terminal {
      width: 100%;
      max-width: 380px;
      padding: 26px 22px 24px;
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: entrada .5s ease backwards;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--red-light);
      font-size: 10px;
      letter-spacing: 1.5px;
    }

    .topline i {
      width: 6px;
      height: 6px;
      background: var(--red-light);
      animation: piscar 1.8s steps(2, start) infinite;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(15px, 4.4vw, 18px);
      font-weight: bold;
      letter-spacing: 2px;
      line-height: 1.4;
      text-align: center;
    }

    .info {
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }

    .info strong {
      display: inline-block;
      margin-top: 2px;
      padding: 1px 8px;
      border: 1px solid #593238;
      background: rgba(165, 42, 50, 0.12);
      color: #e2a2a6;
      letter-spacing: 2px;
    }

    .display {
      min-height: 62px;
      margin-bottom: 18px;
      padding: 14px 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #07080b;
      box-shadow: inset 0 0 20px rgba(76, 255, 122, 0.04);
      color: var(--green);
      font-size: clamp(22px, 7vw, 28px);
      letter-spacing: 4px;
      text-align: center;
      text-shadow: 0 0 8px rgba(76, 255, 122, 0.35);
      white-space: nowrap;
    }

    .teclado {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .teclado button {
      display: grid;
      place-items: center;
      aspect-ratio: 1.25 / 1;
      min-height: 56px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--key);
      color: var(--text);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 22px;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color .15s ease, border-color .15s ease, transform .08s ease;
    }

    .teclado button:hover {
      border-color: #634047;
      background: var(--key-hover);
    }

    .teclado button:active,
    .teclado button.press {
      border-color: var(--red-light);
      background: #2c1a1f;
      transform: scale(.95);
    }

    .teclado button.limpar {
      color: var(--red-light);
    }

    .teclado button.ligar-btn {
      border-color: #2d6b3f;
      background: #14301c;
    }

    .teclado button.ligar-btn:hover {
      background: #1a4026;
    }

    .teclado button.ligar-btn:active,
    .teclado button.ligar-btn.press {
      border-color: var(--green);
      background: #1f5230;
    }

    .teclado button:focus-visible,
    .terminal-btn:focus-visible,
    .fechar-video:focus-visible {
      outline: 2px solid var(--red-light);
      outline-offset: 3px;
    }

    .teclado img {
      display: block;
      width: 28px;
      height: auto;
    }

    .msg {
      min-height: 24px;
      margin-top: 18px;
      color: var(--green);
      font-size: 14px;
      letter-spacing: 1px;
      text-align: center;
      text-shadow: 0 0 8px rgba(76, 255, 122, 0.3);
    }

    .terminal-btn {
      margin-top: 22px;
      padding: 12px 20px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #14161c;
      color: var(--muted);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 1px;
      touch-action: manipulation;
      transition: background-color .25s ease, color .25s ease, border-color .25s ease;
    }

    .terminal-btn:hover {
      border-color: #fff;
      background: #fff;
      color: #000;
    }

    /* Container de vídeo */
    #videoContainer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: black;
    }

    video {
      max-width: 100%;
      max-height: 100%;
      border: 1px solid #444;
    }

    .fechar-video {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      z-index: 101;
      padding: 8px 13px;
      border: 1px solid #75404a;
      background: rgba(89, 38, 46, 0.85);
      color: #fff;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 1px;
    }

    @keyframes entrada {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes piscar {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @media (min-width: 900px) {
      .terminal {
        max-width: 420px;
        padding: 32px 28px 28px;
      }

      .teclado button {
        font-size: 24px;
      }
    }

    @media (max-height: 640px) {
      .terminal {
        padding: 18px 18px 18px;
      }

      .info {
        margin-bottom: 14px;
        padding-bottom: 12px;
      }

      .display {
        min-height: 52px;
        margin-bottom: 12px;
        padding: 10px 14px;
      }

      .teclado {
        gap: 8px;
      }

      .teclado button {
        aspect-ratio: auto;
        min-height: 46px;
      }

      .msg {
        margin-top: 10px;
      }

      .terminal-btn {
        margin-top: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="terminal">
    <div class="topline"><i></i> CANAL SEGURO // SAC 51</div>

    <h1>TERMINAL DE COMUNICAÇÃO – SAC 51</h1>
    <div class="info">Disque o número <strong>4190619</strong> para tentar conexão</div>

    <div class="display" id="display">_</div>

    <div class="teclado">
      <button onclick="digitar('1')">1</button>
      <button onclick="digitar('2')">2</button>
      <button onclick="digitar('3')">3</button>
      <button onclick="digitar('4')">4</button>
      <button onclick="digitar('5')">5</button>
      <button onclick="digitar('6')">6</button>
      <button onclick="digitar('7')">7</button>
      <button onclick="digitar('8')">8</button>
      <button onclick="digitar('9')">9</button>
      <button class="limpar" onclick="limpar()" aria-label="Limpar">C</button>
      <button onclick="digitar('0')">0</button>
      <button class="ligar-btn" onclick="ligar()" aria-label="Ligar"><img src="ligar.png" alt="Ligar" /></button>
    </div>

    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </div>

  <button class="terminal-btn" onclick="voltar()">← VOLTAR AO TERMINAL</button>

  <div id="videoContainer">
    <button class="fechar-video" type="button" onclick="fecharVideo()">✕ FECHAR</button>
    <video id="vidKA" src="explicativoKA.mp4" playsinline></video>
  </div>

  <audio id="audioDDD" src="DDD.mp3"></audio>
  <audio id="audioDC" src="DC.mp3"></audio>
  <audio id="audioAtendimento" src="atendimento.mp3"></audio>
  <audio id="audioOpcao3" src="opcao3.mp3"></audio>
  <audio id="audioKA114" src="ka114menu.mp3"></audio>
  <audio id="audioSkinwalker" src="skinwalker.mp3"></audio>
  <audio id="audioEstrela" src="exp_estrela.mp3"></audio>
  <audio id="audioGerencia" src="gerencia.mp3"></audio>
  <audio id="audioInfoPriv" src="informacoes.mp3"></audio>
  <audio id="audioAlfa" src="alfa.mp3"></audio>

  <script>
    let numero = "";
    let chamadas = 0;
    let etapa = 0;
    const display = document.getElementById("display");
    const msg = document.getElementById("msg");
    const videoCont = document.getElementById("videoContainer");
    const videoPlayer = document.getElementById("vidKA");

    const audios = {
      DDD: document.getElementById("audioDDD"),
      DC: document.getElementById("audioDC"),
      atendimento: document.getElementById("audioAtendimento"),
      opcao3: document.getElementById("audioOpcao3"),
      ka114: document.getElementById("audioKA114"),
      skinwalker: document.getElementById("audioSkinwalker"),
      estrela: document.getElementById("audioEstrela"),
      gerencia: document.getElementById("audioGerencia"),
      info: document.getElementById("audioInfoPriv"),
      alfa: document.getElementById("audioAlfa")
    };

    function limpar() {
      numero = "";
      display.textContent = "_";
      msg.textContent = "";
    }

    function digitar(digito) {
      if (etapa === 0 && numero.length < 10) {
        numero += digito;
        display.textContent = numero;
      }
      else if (etapa === 1) {
        if (digito === "1") playAudio("gerencia");
        else if (digito === "2") playAudio("info");
        else if (digito === "3") { etapa = 2; playAudio("opcao3"); }
      }
      else if (etapa === 2) {
        if (digito === "1") { etapa = 3; playAudio("ka114"); }
        else if (digito === "2") playAudio("alfa");
        else if (digito === "3") { etapa = 1; playAudio("atendimento"); }
      }
      else if (etapa === 3) {
        if (digito === "1") playAudio("skinwalker");
        else if (digito === "2") playAudio("estrela");
        else if (digito === "3") { playVideo(); } 
        else if (digito === "4") { etapa = 2; playAudio("opcao3"); } 
      }
    }

    function playVideo() {
      stopAll();
      videoCont.style.display = "flex";
      videoPlayer.play();
    }

    function fecharVideo() {
      videoPlayer.pause();
      videoPlayer.currentTime = 0;
      videoCont.style.display = "none";
    }

    videoPlayer.onended = function() {
      fecharVideo();
    };

    function playAudio(nome) {
      stopAll();
      if(audios[nome]) audios[nome].play();
    }

    function stopAll() {
      for (let key in audios) {
        audios[key].pause();
        audios[key].currentTime = 0;
      }
      fecharVideo();
    }

    function ligar() {
      chamadas++;
      msg.textContent = "Chamando...";
      if (chamadas < 3) {
        if (numero === "4190619") playAudio("DDD");
        else playAudio("DC");
      } else {
        etapa = 1;
        playAudio("atendimento");
      }
      numero = "";
      display.textContent = "_";
    }

    // Função que abre o arquivo BASE.html
    function voltar() { 
      window.location.href = "BASE.html"; 
    }

    Object.values(audios).forEach(audio => {
      audio.addEventListener("ended", () => { msg.textContent = ""; });
    });

    /* ---- EXTRAS DE USO (não alteram a lógica acima) ---- */

    // Vibração leve ao tocar nas teclas (celular)
    document.querySelectorAll(".teclado button").forEach(btn => {
      btn.addEventListener("pointerdown", () => {
        if (navigator.vibrate) navigator.vibrate(10);
      });
    });

    // Teclado físico: números, Enter = ligar, Backspace/Esc = limpar
    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      let alvo = null;

      if (/^[0-9]$/.test(e.key)) {
        digitar(e.key);
        alvo = [...document.querySelectorAll(".teclado button")]
          .find(b => b.textContent.trim() === e.key);
      } else if (e.key === "Enter") {
        e.preventDefault();
        ligar();
        alvo = document.querySelector(".ligar-btn");
      } else if (e.key === "Backspace" || e.key === "Escape") {
        limpar();
        alvo = document.querySelector(".limpar");
      }

      if (alvo) {
        alvo.classList.add("press");
        setTimeout(() => alvo.classList.remove("press"), 120);
      }
    });
  </script>
</body>
</html>
