<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#202c33">
<title>WhatsApp</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2325d366'/%3E%3Cpath d='M16 7a9 9 0 0 0-7.8 13.5L7 25l4.6-1.2A9 9 0 1 0 16 7z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  --app-bg:#0c1317;--side:#111b21;--panel:#202c33;--hover:#202c33;--active:#2a3942;
  --line:#222d34;--text:#e9edef;--text2:#8696a0;--accent:#00a884;
  --out:#005c4b;--in:#202c33;--chat:#0b141a;--doodle:rgba(255,255,255,.035);
  --chip:#182229;--chip-act:#0a332c;--chip-act-t:#00a884;--tick:#53bdeb;
  --sys:#182229;--sys-t:#8696a0;--enc:#182229;--enc-t:#ffd279;--input:#2a3942;
  --shadow:0 1px .5px rgba(11,20,26,.35);--avatar:#6a7175;
}
@media (prefers-color-scheme:light){
  :root{
    --app-bg:#d1d7db;--side:#fff;--panel:#f0f2f5;--hover:#f5f6f6;--active:#f0f2f5;
    --line:#e9edef;--text:#111b21;--text2:#667781;--accent:#00a884;
    --out:#d9fdd3;--in:#fff;--chat:#efeae2;--doodle:rgba(11,20,26,.05);
    --chip:#f0f2f5;--chip-act:#d9fdd3;--chip-act-t:#015c4b;--tick:#53bdeb;
    --sys:#fff;--sys-t:#54656f;--enc:#ffeecd;--enc-t:#54656f;--input:#fff;
    --shadow:0 1px .5px rgba(11,20,26,.13);--avatar:#dfe5e7;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:var(--vvh,100%)}
body{font-family:"Segoe UI","Helvetica Neue",Helvetica,"Lucida Grande",Arial,Ubuntu,Cantarell,"Fira Sans",sans-serif;background:var(--app-bg);color:var(--text);overflow:hidden;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
.app{display:flex;height:100%;width:100%;max-width:1600px;margin:0 auto;background:var(--side);position:relative;overflow:hidden}
@media (min-width:1441px){.app{height:calc(100% - 38px);margin-top:19px;box-shadow:0 6px 18px rgba(11,20,26,.35)}}
.side{position:relative;width:30%;min-width:340px;max-width:480px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--side);padding-top:env(safe-area-inset-top,0)}
.side-head{height:59px;background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:none}
.side-head h1{font-size:20px;font-weight:700;letter-spacing:-.2px}
.icons{display:flex;gap:4px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text2)}
.ib:hover{background:var(--active)}
.ib:focus-visible,.chip:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.search{padding:8px 12px 4px;flex:none}
.search label{display:flex;align-items:center;gap:22px;height:35px;background:var(--panel);border-radius:8px;padding:0 14px;color:var(--text2)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:14px;min-width:0}
.search input::placeholder{color:var(--text2)}
.chips{display:flex;gap:6px;padding:8px 12px 10px;flex:none;overflow-x:auto;scrollbar-width:none}
.chip{padding:5px 12px;border-radius:999px;background:var(--chip);color:var(--text2);font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chip-act);color:var(--chip-act-t)}
.list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--active) transparent}
.row{display:flex;align-items:center;gap:15px;width:100%;padding:0 15px;height:72px;text-align:left;position:relative}
.row:hover{background:var(--hover)}
.row.sel{background:var(--active)}
.avatar{width:49px;height:49px;border-radius:50%;background:var(--avatar);flex:none;display:grid;place-items:end center;overflow:hidden;color:#cfd4d7}
.avatar svg{width:45px;height:45px;margin-bottom:-6px}
.rbody{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--line);gap:3px}
.row:last-child .rbody{border-bottom:0}
.r1,.r2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.name{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.when{font-size:12px;color:var(--text2);flex:none}
.prev{font-size:14px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px;min-width:0}
.prev svg{flex:none}
.pin{color:var(--text2);flex:none}
.empty-list{padding:40px 30px;text-align:center;color:var(--text2);line-height:1.5}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--chat);position:relative}
.blank{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;background:var(--panel);border-bottom:6px solid var(--accent)}
.blank h2{font-size:32px;font-weight:300;color:var(--text)}
.blank p{color:var(--text2);max-width:440px;line-height:1.5;font-size:14px}
.blank small{color:var(--text2);display:flex;align-items:center;gap:6px;position:absolute;bottom:28px;font-size:14px}
.chat{display:none;flex-direction:column;flex:1;min-height:0}
.main.open .chat{display:flex}
.main.open .blank{display:none}
.chat-head{height:59px;background:var(--panel);display:flex;align-items:center;gap:14px;padding:0 16px;flex:none}
.chat-head .avatar{width:40px;height:40px}
.chat-head .avatar svg{width:36px;height:36px}
.ch-t{flex:1;min-width:0;cursor:pointer}
.ch-t b{display:block;font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-t span{font-size:13px;color:var(--text2)}
.back{display:none;margin-left:-8px}
.msgs{flex:1;overflow-y:auto;padding:16px 8% 10px;background-color:var(--chat);background-image:radial-gradient(var(--doodle) 1.5px,transparent 1.6px),radial-gradient(var(--doodle) 1px,transparent 1.1px);background-size:38px 38px,23px 23px;background-position:0 0,11px 17px;scrollbar-width:thin;scrollbar-color:var(--active) transparent;display:flex;flex-direction:column}
.enc{align-self:center;max-width:540px;text-align:center;background:var(--enc);color:var(--enc-t);font-size:12.5px;line-height:1.45;padding:7px 12px;border-radius:8px;margin:0 0 14px;box-shadow:var(--shadow)}
.day{align-self:center;background:var(--sys);color:var(--sys-t);font-size:12.5px;padding:5px 12px;border-radius:8px;margin:10px 0 12px;box-shadow:var(--shadow)}
.b{position:relative;max-width:65%;padding:6px 7px 8px 9px;border-radius:8px;font-size:14.2px;line-height:19px;box-shadow:var(--shadow);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;margin-top:2px}
.b.in{align-self:flex-start;background:var(--in)}
.b.out{align-self:flex-end;background:var(--out)}
.b.img.photo{width:min(300px,100%)}
.img-real{width:100%;display:block;border-radius:6px;background:#fff}
.b.img{white-space:normal;padding:3px 3px 6px 3px;width:min(260px,100%)}
.img-ph{width:100%;aspect-ratio:1/1;border-radius:6px;background:rgba(134,150,160,.22);display:grid;place-items:center;color:var(--text2)}
.img-note{font-size:12px;font-style:italic;color:var(--text2);margin:4px 6px 0;line-height:16px}
.b.out .img-note{color:rgba(233,237,239,.6)}
@media (prefers-color-scheme:light){.b.out .img-note{color:#667781}}
.b.img .m{float:none;margin:0;justify-content:flex-end;padding:0 4px}
.b.del{font-style:italic;color:var(--text2)}
.b.del svg{display:inline-block;vertical-align:-3px;margin-right:5px}
.b.out.del{color:rgba(233,237,239,.6)}
@media (prefers-color-scheme:light){.b.out.del{color:#667781}}
.badge{min-width:20px;height:20px;border-radius:10px;background:#25d366;color:#0b141a;font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 6px;flex:none}
.when.unr{color:#25d366}
.chip-n{display:inline-grid;min-width:18px;height:18px;border-radius:9px;background:#25d366;color:#0b141a;font-size:11px;font-weight:700;place-items:center;margin-left:6px;padding:0 5px;vertical-align:1px}
.unread-div{align-self:stretch;text-align:center;margin:12px -8% 8px;padding:5px 0;background:rgba(134,150,160,.16);color:var(--text2);font-size:12.5px;letter-spacing:.3px;text-transform:uppercase}
.b.file{cursor:pointer;white-space:normal;min-width:240px}
.file-row{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.07);border-radius:7px;padding:9px 10px;margin-bottom:2px}
.file-ic{flex:none;color:var(--text2);display:grid;place-items:center}
.file-info{display:flex;flex-direction:column;min-width:0}
.file-name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta{font-size:12px;color:var(--text2)}
.b.first{margin-top:10px}
.b .sacn{display:block;font-weight:700}
.b.first.in{border-top-left-radius:0}
.b.first.out{border-top-right-radius:0}
.b.first.in::before,.b.first.out::before{content:"";position:absolute;top:0;width:8px;height:13px}
.b.first.in::before{left:-8px;background:var(--in);clip-path:polygon(100% 0,0 0,100% 100%)}
.b.first.out::before{right:-8px;background:var(--out);clip-path:polygon(0 0,100% 0,0 100%)}
.who{display:block;font-size:12.8px;font-weight:500;margin-bottom:1px}
.sysmsg{align-self:center;background:var(--sys);color:var(--sys-t);font-size:12.5px;line-height:1.4;padding:5px 12px;border-radius:8px;margin:8px 0;box-shadow:var(--shadow);text-align:center;max-width:80%}
.mem{display:flex;align-items:center;gap:14px;padding:8px 0}
.mem .avatar{width:40px;height:40px}
.mem .avatar svg{width:36px;height:36px}
.mem b{display:block;font-weight:400;font-size:16px}
.mem small{display:block;color:var(--text2);font-size:13px;margin-top:1px}
.m{float:right;margin:7px 0 -5px 10px;font-size:11px;line-height:15px;color:var(--text2);display:inline-flex;align-items:center;gap:3px;user-select:none}
.b.out .m{color:rgba(233,237,239,.6)}
@media (prefers-color-scheme:light){.b.out .m{color:#667781}}
.tick{color:var(--tick)}
.tick.sent{color:var(--text2)}
.composer{background:var(--panel);display:flex;align-items:center;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0));flex:none}
.composer .field{flex:1;background:var(--input);border-radius:8px;height:42px;display:flex;align-items:center}
.composer input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:15px;padding:0 12px;min-width:0;height:100%}
.composer input::placeholder{color:var(--text2)}
.info{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--chat);border-left:1px solid var(--line);display:none;flex-direction:column;z-index:6;padding-top:env(safe-area-inset-top,0)}
.info.on{display:flex}
.info-head{height:59px;background:var(--panel);display:flex;align-items:center;gap:16px;padding:0 16px;flex:none;font-size:16px}
.info-body{flex:1;overflow-y:auto}
.info-top{background:var(--side);display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 20px 22px;margin-bottom:8px}
.info-top .avatar{width:200px;height:200px}
.info-top .avatar svg{width:190px;height:190px;margin-bottom:-26px}
.info-top h2{font-size:24px;font-weight:400;margin-top:14px;text-align:center}
.info-top small{color:var(--text2);font-size:16px}
.info-sec{background:var(--side);padding:14px 30px 20px}
.info-sec span{display:block;color:var(--text2);font-size:14px;margin-bottom:8px}
.info-sec p{font-size:17px;line-height:1.4;word-break:break-word}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.info-top .avatar img,.set-av img{object-position:center 18%}
.hl{display:flex;align-items:center;gap:12px;min-width:0}
.side-head .me{width:40px;height:40px;padding:0;flex:none}
.side-head .me:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dd{position:absolute;top:50px;right:12px;background:var(--panel);border-radius:8px;box-shadow:0 2px 14px rgba(11,20,26,.45);padding:8px 0;min-width:190px;z-index:8;display:none}
.dd.on{display:block}
.dd button{display:block;width:100%;text-align:left;padding:10px 22px;font-size:15px}
.dd button:hover{background:var(--active)}
.settings{position:absolute;inset:0;background:var(--chat);display:none;flex-direction:column;z-index:7;padding-top:env(safe-area-inset-top,0)}
.settings.on{display:flex}
.settings .avatar img{object-position:center 18%}
.b.call{display:flex;align-items:center;gap:12px;min-width:250px;padding:8px 9px 8px 8px;white-space:normal}
.call-ic{width:40px;height:40px;border-radius:50%;background:rgba(134,150,160,.22);display:grid;place-items:center;flex:none}
.call-ic.miss{color:#f15c6d}
.call-ic.ok{color:var(--accent)}
.call-t{flex:1;min-width:0}
.call-t b{display:block;font-weight:600;font-size:15px;line-height:20px}
.call-t span{display:block;font-size:13.5px;line-height:18px;color:var(--text2)}
.b.out .call-t span{color:rgba(233,237,239,.65)}
@media (prefers-color-scheme:light){.b.out .call-t span{color:#667781}}
.b.call .m{float:none;margin:0 0 0 auto;align-self:flex-end}
.b.aud{min-width:260px;white-space:normal;padding:8px 9px 6px 8px}
.aud-row{display:flex;align-items:center;gap:8px}
.aud-play{width:34px;height:34px;display:grid;place-items:center;color:var(--text2);opacity:.75;cursor:default;flex:none}
.aud-wave{flex:1;display:flex;align-items:center;gap:2px;height:28px;min-width:0}
.aud-wave i{display:block;width:3px;border-radius:2px;background:var(--text2);opacity:.65;flex:none}
.b.out .aud-wave i{background:rgba(233,237,239,.6)}
.b.out .aud-play{color:rgba(233,237,239,.7)}
@media (prefers-color-scheme:light){.b.out .aud-wave i{background:#8696a0}.b.out .aud-play{color:#667781}}
.aud-meta{display:flex;align-items:flex-end;justify-content:flex-end;margin-top:-2px}
.aud-dur{font-size:12.5px;color:var(--text2);line-height:18px;flex:none;font-variant-numeric:tabular-nums}
.b.out .aud-dur{color:rgba(233,237,239,.6)}
@media (prefers-color-scheme:light){.b.out .aud-dur{color:#667781}}
.b.aud .m{float:none;margin:0}
.aud-note{font-size:12px;font-style:italic;color:var(--text2);margin:3px 0 1px 42px;line-height:16px}
.b.out .aud-note{color:rgba(233,237,239,.6)}
@media (prefers-color-scheme:light){.b.out .aud-note{color:#667781}}
@media (max-width:820px){
  .side{width:100%;max-width:none;min-width:0}
  .main{position:absolute;inset:0;transform:translateX(100%);transition:transform .22s ease;z-index:5}
  .app.show-chat .main{transform:none}
  .back{display:grid}
  .msgs{padding:12px 4% 8px}
  .b{max-width:82%}
  .blank{display:none}
}
@media (prefers-reduced-motion:reduce){.main{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-user" viewBox="0 0 212 212"><path fill="currentColor" d="M106 0C47.5 0 0 47.5 0 106s47.5 106 106 106 106-47.5 106-106S164.5 0 106 0zm0 40c19.3 0 35 15.7 35 35s-15.7 35-35 35-35-15.7-35-35 15.7-35 35-35zm0 152c-24.6 0-46.6-11-61.5-28.4C52 147 82 138 106 138s54 9 61.5 25.6C152.600 181 130.600 192 106 192z" opacity=".95"/></symbol>
  <symbol id="i-group" viewBox="0 0 212 212"><g fill="currentColor" opacity=".95"><circle cx="106" cy="86" r="27"/><path d="M56 170c0-27 21-44 50-44s50 17 50 44z"/><circle cx="52" cy="98" r="19"/><path d="M14 164c0-17 12-30 30-30 5 0 9 1 13 3-8 8-13 17-13 27z"/><circle cx="160" cy="98" r="19"/><path d="M198 164c0-17-12-30-30-30-5 0-9 1-13 3 8 8 13 17 13 27z"/></g></symbol>
  <symbol id="i-check" viewBox="0 0 16 11"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M1 5.800 4.500 9.300 10.500 1.500M6.500 8.500 7.300 9.300 13.500 1.500"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path fill="currentColor" d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.660-1.340 3-3 3v2h5.970v7l1 1 1-1v-7H19v-2c-1.660 0-3-1.340-3-3z"/></symbol>
</svg>

<div class="app" id="app">
  <aside class="side">
    <header class="side-head">
      <div class="hl"><button class="avatar me" id="me" aria-label="Abrir configurações do perfil"></button><h1>WhatsApp</h1></div>
      <div class="icons">
        <button class="ib" aria-label="Novo chat"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.500 3.500a2.120 2.120 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
        <button class="ib" id="menu-btn" aria-label="Menu" aria-haspopup="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
      </div>
    </header>
    <div class="search"><label><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg><input id="q" type="search" placeholder="Pesquisar ou começar uma nova conversa" autocomplete="off"></label></div>
    <div class="chips" id="chips">
      <button class="chip" aria-pressed="true" data-f="all">Tudo</button>
      <button class="chip" aria-pressed="false" data-f="unread">Não lidas</button>
      <button class="chip" aria-pressed="false" data-f="fav">Favoritas</button>
      <button class="chip" aria-pressed="false" data-f="groups">Grupos</button>
      <button class="chip" aria-pressed="false" data-f="archived">Arquivadas</button>
    </div>
    <div class="list" id="list" role="list"></div>
    <div class="dd" id="dd" role="menu"><button role="menuitem" id="dd-settings">Configurações</button></div>
    <section class="settings" id="settings" aria-label="Configurações">
      <header class="info-head">
        <button class="ib" id="set-back" aria-label="Voltar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
        <span>Configurações</span>
      </header>
      <div class="info-body">
        <div class="info-top">
          <div class="avatar set-av" id="set-av"></div>
        </div>
        <div class="info-sec"><span>Nome</span><p id="set-name"></p></div>
        <div class="info-sec" style="margin-top:8px"><span>Recado</span><p id="set-bio"></p></div>
      </div>
    </section>
  </aside>

  <main class="main" id="main">
    <section class="blank">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="1.200" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 0 0-7.800 13.500L3 21l4.700-1.200A9 9 0 1 0 12 3z"/></svg>
      <h2>WhatsApp Web</h2>
      <p>Envie e receba mensagens sem precisar manter seu celular conectado. Selecione uma conversa para começar.</p>
      <small><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Suas mensagens pessoais são protegidas com a criptografia de ponta a ponta</small>
    </section>
    <section class="chat" id="chat">
      <header class="chat-head">
        <button class="ib back" id="back" aria-label="Voltar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
        <div class="avatar" id="ch-av"><svg><use href="#i-user"/></svg></div>

const MSG_RE = /^\[(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})\] (.+?): ([\s\S]*)$/;

function parse(raw) {
  const chats = [];
  let cur = null;
  for (const line of raw.split(/\r?\n/)) {
    const h = line.match(/^=====\s*(.+?)\s*=====$/);
    if (h) { cur = { name: h[1], msgs: [] }; chats.push(cur); continue; }
    const m = line.match(MSG_RE);
    if (m && cur) {
      cur.msgs.push({
        d: new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]),
        from: m[6],
        text: m[7],
        sys: m[6] === "*"
      });
    } else if (line.trim() && cur && cur.msgs.length) {
      cur.msgs[cur.msgs.length - 1].text += "\n" + line;
    }
  }
  CALLS.forEach(k => {
    const c = chats.find(x => x.name.startsWith(k.chat));
    if (!c) return;
    const t = k.at.match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
    c.msgs.push({
      d: new Date(+t[1], +t[2] - 1, +t[3], +t[4], +t[5]),
      from: k.from === "Danii" ? ME : c.name,
      text: k.kind === "missed" ? "Ligação de voz perdida" : "Ligação de voz",
      call: { kind: k.kind, dur: k.dur || "" }
    });
  });
  AUDIOS.forEach(k => {
    const c = chats.find(x => x.name.startsWith(k.chat));
    if (!c) return;
    const t = k.at.match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
    c.msgs.push({
      d: new Date(+t[1], +t[2] - 1, +t[3], +t[4], +t[5]),
      from: k.from === "Danii" ? ME : c.name,
      text: "🎤 " + k.dur,
      audio: { dur: k.dur }
    });
  });
  chats.forEach(c => c.msgs.sort((a, b) => a.d - b.d));
  chats.forEach(c => {
    c.pinIndex = PINNED.findIndex(p => c.name.startsWith(p));
    c.pinned = c.pinIndex > -1;
    c.archived = ARCHIVED.includes(c.name);
    c.unread = readSet.includes(c.name) ? 0 : c.msgs.filter(m => !m.sys).length;
    c.divider = 0; c.divAt = -1;
    c.group = !!GROUPS[c.name];
    c.members = c.group ? GROUPS[c.name] : [];
    const vis = c.msgs.filter(m => !/^(?:\*\*.+?\*\*\n)?\[apagada\]$/.test(m.text));
    c.last = vis.length ? vis[vis.length - 1] : c.msgs[c.msgs.length - 1];
    const p = PROFILES.find(x => c.name.startsWith(x.key));
    c.bio = p ? p.bio : DEFAULT_BIO;
    c.push = p && p.push ? p.push : "";
    c.img = p && p.img ? p.img : "";
  });
  return chats;
}

const pad = n => String(n).padStart(2, "0");
const hhmm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const daysAgo = d => Math.round((startOfDay(new Date()) - startOfDay(d)) / 864e5);
const weekday = d => d.toLocaleDateString("pt-BR", { weekday: "long" });
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function listTime(d) {
  const n = daysAgo(d);
  if (n <= 0) return hhmm(d);
  if (n === 1) return "Ontem";
  if (n < 7) return weekday(d);
  return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear();
}

function dayLabel(d) {
  const n = daysAgo(d);
  if (n <= 0) return "Hoje";
  if (n === 1) return "Ontem";
  if (n < 7) return cap(weekday(d));
  return d.toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric" });
}

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function callBubble(m, mine, first) {
  const k = m.call.kind;
  const miss = k === "missed";
  const sub = miss ? "Toque para retornar" : k === "outmiss" ? "Sem resposta" : m.call.dur;
  const arrow = mine ? ARROW_OUT : ARROW_IN;
  return '<div class="b call ' + (mine ? "out" : "in") + (first ? " first" : "") + '">' +
    '<div class="call-ic ' + (miss ? "miss" : "ok") + '"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + PHONE + arrow + '</svg></div>' +

    '<span class="m">' + hhmm(m.d) + '</span></div>';
}

function wave(seed) {
  let x = seed * 9301 + 49297, h = [];
  for (let i = 0; i < 32; i++) {
    x = (x * 9301 + 49297) % 233280;
    h.push('<i style="height:' + (18 + Math.round(x / 233280 * 82)) + '%"></i>');
  }
  return h.join("");
}

function audioBubble(m, mine, first) {
  const seed = Math.floor(m.d.getTime() / 60000) % 9973;
  return '<div class="b aud ' + (mine ? "out" : "in") + (first ? " first" : "") + '">' +
    '<div class="aud-row"><button class="aud-play" disabled aria-label="Áudio não recuperado"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>' +
    '<span class="aud-dur">' + esc(m.audio.dur) + '</span>' +
    '<div class="aud-wave">' + wave(seed) + '</div></div>' +
    '<div class="aud-note">(áudios não recuperados)</div>' +
    '<div class="aud-meta">' +
    '<span class="m">' + hhmm(m.d) + (mine ? tk(m) : "") + '</span></div></div>';
}

function fmtSize(n) { return n < 1024 ? n + " B" : (n / 1024).toFixed(1).replace(".", ",") + " KB"; }
function fileBubble(m, mine, first, name) {

function downloadFile(name) {
  const blob = new Blob([FILES[name] || ""], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
document.addEventListener("click", e => { const f = e.target.closest("[data-file]"); if (f) downloadFile(f.dataset.file); });

function sorted() {
  return chats.slice().sort((a, b) => {
    if (a.pinned && b.pinned) return a.pinIndex - b.pinIndex;
    if (a.pinned) return -1;
    if (b.pinned) return 1;
    return b.last.d - a.last.d;
  });
}

function prevText(l) {
  if (/^(?:\*\*.+?\*\*\n)?\[apagada\]$/.test(l.text)) return l.from === ME ? "🚫 Você apagou esta mensagem" : "🚫 Esta mensagem foi apagada";
  const fm = l.text.match(/^\[arquivo:(.+)\]$/);
  if (fm) return "📄 " + fm[1];
  if (/^\[imagem(:\w+)?\]$/.test(l.text)) return "📷 Foto";

function renderChat(c, toDivider) {
  $("ch-name").textContent = c.name;
  $("ch-av").innerHTML = avInner(c);
  $("ch-sub").textContent = c.group ? ["Você"].concat(c.members).join(", ") : "clique aqui para dados do contato";
  const out = ['<div class="enc">As mensagens e ligações são protegidas com a criptografia de ponta a ponta. Somente as pessoas nesta conversa podem ler, ouvir ou compartilhar as mensagens.</div>'];
  let prevDay = null, prevFrom = null;
  c.msgs.forEach((m, mi) => {
    const key = startOfDay(m.d).getTime();
    let first = false;
    if (key !== prevDay) {
      out.push('<div class="day">' + dayLabel(m.d) + "</div>");
      prevDay = key;
      first = true;
    }
    if (c.divider && mi === c.divAt) out.push('<div class="unread-div">' + c.divider + (c.divider === 1 ? " nova mensagem" : " novas mensagens") + "</div>");
    if (m.sys) { out.push('<div class="sysmsg">' + esc(m.text) + "</div>"); prevFrom = null; return; }
    if (m.from !== prevFrom) first = true;
    prevFrom = m.from;
    const mine = m.from === ME;
    if (m.call) { out.push(callBubble(m, mine, first)); return; }
    if (m.audio) { out.push(audioBubble(m, mine, first)); return; }
    const fm = m.text.match(/^\[arquivo:(.+)\]$/);
    if (fm) { out.push(fileBubble(m, mine, first, fm[1])); return; }
    const pm = m.text.match(/^\[imagem:(\w+)\]$/);
    if (pm && PHOTOS[pm[1]]) { out.push(photoBubble(m, mine, first, PHOTOS[pm[1]])); return; }
    if (m.text === "[imagem]") { out.push(imageBubble(m, mine, first)); return; }
    const who = c.group && !mine && first ? '<span class="who" style="color:' + (WHO_COLORS[m.from] || "#53bdeb") + '">' + esc(m.from) + "</span>" : "";
    const dm = m.text.match(/^(?:\*\*(.+?)\*\*\n)?\[apagada\]$/);
    if (dm) { out.push(delBubble(m, mine, first, who, dm[1])); return; }
    out.push('<div class="b ' + (mine ? "out" : "in") + (first ? " first" : "") + '">' + who + fmt(m.text) +
      '<span class="m">' + hhmm(m.d) + (mine ? tk(m) : "") + "</span></div>");
  });
  const el = $("msgs");
  el.innerHTML = out.join("");
  const dv = toDivider && el.querySelector(".unread-div");
  el.scrollTop = dv ? Math.max(0, dv.getBoundingClientRect().top - el.getBoundingClientRect().top + el.scrollTop - 56) : el.scrollHeight;
}

      selected.members.map(n => chats.find(x => x.name === n) || { name: n, bio: DEFAULT_BIO, img: "" }));
    $("info-mlist").innerHTML = rows.map(r =>
      '<div class="mem"><div class="avatar">' + avInner(r) + '</div><div><b>' + esc(r.name) + "</b><small>" + esc(r.bio) + "</small></div></div>").join("");
  }
  $("info").classList.add("on");
}
function closeInfo() { $("info").classList.remove("on"); }

function open(name) {
  closeInfo();
  selected = chats.find(c => c.name === name);
  if (selected.unread) {
    const ns = selected.msgs.map((m, i) => m.sys ? -1 : i).filter(i => i >= 0);
    selected.divider = selected.unread;
    selected.divAt = ns[ns.length - selected.unread];
    selected.unread = 0;
    markRead(selected.name);
  }
  $("main").classList.add("open");
  $("app").classList.add("show-chat");
  renderChat(selected, true);
  renderList();
  if (window.matchMedia("(min-width:821px)").matches) $("txt").focus();
}

$("list").addEventListener("click", e => {
  const r = e.target.closest(".row");
  if (r) open(r.dataset.n);
});
$("q").addEventListener("input", renderList);
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  renderList();
});
$("back").addEventListener("click", () => {
  closeInfo();
  $("app").classList.remove("show-chat");
  if (selected) { selected.divider = 0; selected.divAt = -1; }
  selected = null;
  $("main").classList.remove("open");
  renderList();
});
const REPLY_DELAY = 25000;
function isSiteQuestion(t) {
  const n = t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  const n2 = n.replace(/\bpor ?que\b/g, " ");
  const ask = /\b(o ?que|oque|oq|o ?q|q|que|qual|quais|qq|explica|me explica|do que se trata|que isso)\b/.test(n2);
  const subj = /(site|projectka|projeto|\bisso\b|negocio|\bessa coisa|\bessa parada|protocolo|\btudo isso|que (ta|esta) acontecendo)/.test(n);
  return (ask && subj) || /^(o )?(site|projectka114)$/.test(n);
}
const REPLIES = [
  { key: "Kin", text: "depois te respondo danii" },
  { key: "Jade", text: "Estrelinha, agora não consigo responder, depois te mando um oi" },
  { key: "~", text: "Não posso te responder. Leia o arquivo e tudo será respondido.", match: isSiteQuestion }
];
function scheduleReply(c, msg) {
  const r = c.group ? null : REPLIES.find(x => c.name.startsWith(x.key));
  if (!r || c.replying) return;
  if (r.match && !r.match(msg.text)) return;
  c.replying = true;
  const targets = () => r.match ? [msg] : c.msgs.filter(m => m.from === ME);
  const refresh = () => { if (selected === c) renderChat(c); renderList(); };
  setTimeout(() => { targets().forEach(m => { if (m.pending) { m.pending = false; m.sent = true; } }); refresh(); }, REPLY_DELAY - 5000);
  setTimeout(() => { targets().forEach(m => { if (m.sent) m.sent = false; }); refresh(); }, REPLY_DELAY - 4000);
  setTimeout(() => { if (selected === c) $("ch-sub").textContent = "digitando…"; }, REPLY_DELAY - 2500);
  setTimeout(() => {
    c.replying = false;
    c.msgs.push({ d: new Date(), from: c.name, text: r.text });
    c.last = c.msgs[c.msgs.length - 1];
    if (selected === c) renderChat(c);
    else c.unread = (c.unread || 0) + 1;
    renderList();
  }, REPLY_DELAY);
}
function sendMsg() {
  const v = $("txt").value.trim();
  if (!v || !selected) return;
  const msg = { d: new Date(), from: ME, text: v, pending: true };
  selected.msgs.push(msg);
  selected.last = selected.msgs[selected.msgs.length - 1];
  $("txt").value = "";
  renderChat(selected);
  renderList();
  scheduleReply(selected, msg);
}
$("form").addEventListener("submit", e => { e.preventDefault(); sendMsg(); });
$("send").addEventListener("pointerdown", e => e.preventDefault());
$("send").addEventListener("mousedown", e => e.preventDefault());
$("send").addEventListener("click", e => { e.preventDefault(); sendMsg(); });
$("txt").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); sendMsg(); } });
if (window.visualViewport) {
  const fit = () => { document.documentElement.style.setProperty("--vvh", window.visualViewport.height + "px"); window.scrollTo(0, 0); };
  window.visualViewport.addEventListener("resize", fit);
  window.visualViewport.addEventListener("scroll", fit);
  fit();
}
document.querySelector(".chat-head").addEventListener("click", e => {
  if (e.target.closest(".ch-t, .avatar")) openInfo();
});
$("info-close").addEventListener("click", closeInfo);
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("settings").classList.contains("on")) closeSettings();
  else if ($("dd").classList.contains("on")) closeDd();
  else if ($("info").classList.contains("on")) closeInfo();
  else if (selected) $("back").click();
});

function openSettings() { closeDd(); $("settings").classList.add("on"); }
function closeSettings() { $("settings").classList.remove("on"); }
function closeDd() { $("dd").classList.remove("on"); }
(function initMe() {
  const h = '<img src="' + ME_PROFILE.img + '" alt="">';
  $("me").innerHTML = h;
  $("set-av").innerHTML = h;
  $("set-name").textContent = ME_PROFILE.name;
  $("set-bio").textContent = ME_PROFILE.bio;
})();
$("me").addEventListener("click", openSettings);
$("dd-settings").addEventListener("click", openSettings);
$("set-back").addEventListener("click", closeSettings);
$("menu-btn").addEventListener("click", e => { e.stopPropagation(); $("dd").classList.toggle("on"); });
document.addEventListener("click", e => { if (!e.target.closest("#dd")) closeDd(); });

renderList();
</script>
